<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="letter-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Dark background with gradient accent -->
  <rect width="256" height="256" fill="#090b10"/>
  <circle cx="128" cy="128" r="120" fill="url(#bg-gradient)"/>
  
  <!-- Premium border -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.3"/>
  
  <!-- Letter "A" - Minimalist, Premium Style -->
  <text
    x="128"
    y="160"
    font-family="'Inter', 'Helvetica Neue', sans-serif"
    font-size="140"
    font-weight="700"
    text-anchor="middle"
    fill="url(#letter-gradient)"
    letter-spacing="-4"
  >A</text>
</svg>
